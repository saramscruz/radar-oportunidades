name: Ingestão diária — EUR-Lex (Jornal Oficial, Série L)

# Corre todos os dias úteis às 09:15 UTC — 15 min depois do DR, para não
# sobrecarregar o Supabase com dois workflows a arrancar ao mesmo tempo.
on:
  schedule:
    - cron: "15 9 * * 1-5"
  workflow_dispatch: {}

jobs:
  ingerir_eurlex:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correr ingestão
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/ingestao_diaria_eurlex.py
