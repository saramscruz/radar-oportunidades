name: Checklist de manutenção mensal

# Corre no dia 1 de cada mês às 08:00 UTC, mais um gatilho manual de recurso
# (o agendamento do GitHub Actions é best-effort — pode atrasar-se; ver PRD 7.2).
on:
  schedule:
    - cron: "7 8 1 * *"
  workflow_dispatch: {}

jobs:
  gerar_checklist:
    runs-on: ubuntu-latest
    # Sem isto, o token automático do workflow não tem permissão para criar
    # Issues (comportamento por defeito em repositórios mais recentes) —
    # foi a causa do erro "Resource not accessible by integration".
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar checklist
        id: checklist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/checklist_mensal.py > checklist.md
          echo "checklist gerado"

      - name: Abrir Issue com o checklist
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('checklist.md', 'utf8');
            const hoje = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Manutenção mensal — ${hoje}`,
              body: body,
              labels: ['manutenção']
            });